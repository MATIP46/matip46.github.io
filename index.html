<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voxel Sandbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="overlay">
    <div class="panel">
      <h1>Voxel Sandbox</h1>
      <p>A tiny browser-based block world.</p>
      <p><b>WASD</b> move · <b>Space</b> jump · <b>Mouse</b> look</p>
      <p><b>Left click</b> break · <b>Right click</b> place · <b>1–3</b> select block</p>
      <button id="startButton">Play</button>
      <p class="small">Click Play, then click the game to capture the mouse. Press Esc to release it.</p>
    </div>
  </div>

  <div id="hud">
    <div id="crosshair">+</div>
    <div id="status">Click Play to begin</div>
    <div id="hotbar" aria-label="Block selection">
      <button class="slot selected" data-type="grass"><span class="swatch grass"></span><span>1</span><small>Grass</small></button>
      <button class="slot" data-type="dirt"><span class="swatch dirt"></span><span>2</span><small>Dirt</small></button>
      <button class="slot" data-type="stone"><span class="swatch stone"></span><span>3</span><small>Stone</small></button>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
